apiVersion: 1

providers:
  - name: "RAG Knowledge Base Dashboards"
    orgId: 1
    folder: "RAG Knowledge Base"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
