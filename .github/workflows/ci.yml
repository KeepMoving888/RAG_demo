# ============================================================
# Enterprise RAG Knowledge Base - CI/CD Pipeline
# 后端 lint + 测试 / 前端构建检查 / Docker 镜像构建
# 触发: push 到 main/develop, 以及所有 PR
# ============================================================
name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

jobs:
  # ======================== 后端 Lint + 单元测试 ========================
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.10: ruff.toml target-version=py310, 兼容本地开发
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 使用 requirements-dev.txt (轻量级, 排除 torch/paddlepaddle 等重型包)
          # 重型包在代码中懒加载 + try/except, 离线降级模式下不影响测试
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check app tests

      - name: Format check with ruff
        run: python -m ruff format --check app tests

      - name: Run unit tests
        env:
          APP_ENV: test
          LLM_PROVIDER: offline
          EMBEDDING_DEVICE: cpu
          POSTGRES_HOST: localhost
          # 使用 invalid 主机名强制快速失败, 触发全链路降级 (BM25 only /
          # Redis 不可用 / Neo4j 不可用), 避免连接超时拖慢 CI.
          # conftest.py 用 setdefault 不会覆盖此处设置.
          REDIS_HOST: invalid
          MILVUS_HOST: invalid
          NEO4J_HOST: invalid
        # conftest.py 已配置 SQLite 内存库 + 全链路降级, 无需外部服务
        # 覆盖率阈值 40%: .coveragerc 已 omit API/integration 层
        # (需 TestClient + 真实服务, 由集成测试覆盖)
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=40

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ======================== 前端构建检查 ========================
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ======================== Docker 镜像构建 (仅 main 分支) ========================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: rag-kb-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: rag-kb-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
