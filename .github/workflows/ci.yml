# ============================================================
# Enterprise RAG Knowledge Base - CI/CD Pipeline
# 后端 lint + 测试 / 前端构建检查 / Docker 镜像构建
# 触发: push 到 main/develop, 以及所有 PR
# ============================================================
name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

jobs:
  # ======================== 后端 Lint + 单元测试 ========================
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check app tests

      - name: Format check with ruff
        run: ruff format --check app tests

      - name: Run unit tests
        env:
          APP_ENV: test
          LLM_PROVIDER: offline
          EMBEDDING_DEVICE: cpu
          POSTGRES_HOST: localhost
          REDIS_HOST: localhost
          MILVUS_HOST: localhost
          NEO4J_HOST: localhost
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ======================== 前端构建检查 ========================
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  # ======================== Docker 镜像构建 (仅 main 分支) ========================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: rag-kb-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: rag-kb-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
